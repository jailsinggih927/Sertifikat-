<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Portal Pencarian & Unduh E-Sertifikat</title>
  <!-- Ikon Tab Browser (Menggunakan ikon topi toga/sertifikat) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Layar Loading saat Apps Script sedang memuat */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #dce1e7;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    .loading-text {
      color: #475569;
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Indikator Loading -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Memuat Portal E-Sertifikat...</div>
  </div>

  <!-- Iframe Portal Apps Script -->
  <iframe 
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycby_86Hly2fO4T5y82dHtijdq7gPnKXSE_wXCdzbfjVd4zHpw1RvWTqc5TtBo1fdVch0lw/exec" 
    allow="clipboard-read; clipboard-write"
    onload="sembunyikanLoader()">
  </iframe>

  <script>
    function sembunyikanLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }
  </script>

</body>
</html>
