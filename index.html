<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Viewport standar tanpa mengunci skala agar titik sentuh keyboard HP tidak bergeser -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pencarian & Unduh E-Sertifikat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Gunakan posisi absolut standar agar tidak bentrok dengan keyboard HP */
    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Tombol Refresh Mengambang di Pojok Kanan Bawah */
    .btn-refresh {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 999;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe 
      id="gas-frame"
      src="https://script.google.com/macros/s/AKfycby_86Hly2fO4T5y82dHtijdq7gPnKXSE_wXCdzbfjVd4zHpw1RvWTqc5TtBo1fdVch0lw/exec" 
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

  <!-- Tombol Muat Ulang Manual untuk HP -->
  <button class="btn-refresh" onclick="muatUlangPortal()">
    <span>↻</span> Muat Ulang
  </button>

  <script>
    function muatUlangPortal() {
      const frame = document.getElementById('gas-frame');
      frame.src = frame.src;
    }
  </script>

</body>
</html>
